name: Snyk npm workspaces
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**/package.json'
      - package-lock.json
      - .github/workflows/snyk.yml
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: kokatenakul11
    steps:
      - name: Check Snyk credential
        id: auth
        shell: bash
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Add the SNYK_TOKEN repository secret, then rerun this workflow to scan and monitor all npm workspaces."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.auth.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.auth.outputs.enabled == 'true'
      - name: Install pinned Snyk CLI
        if: steps.auth.outputs.enabled == 'true'
        run: npm install --global snyk@1.1308.4
      - name: Update Snyk workspace projects
        if: steps.auth.outputs.enabled == 'true'
        run: snyk monitor --all-projects --dev --detection-depth=4 --org="$SNYK_ORG" --remote-repo-url=https://github.com/Naks-bro/seiketsu-platform --target-reference="$GITHUB_REF_NAME"
      - name: Check dependency vulnerabilities
        if: steps.auth.outputs.enabled == 'true'
        run: snyk test --all-projects --dev --detection-depth=4 --org="$SNYK_ORG" --severity-threshold=high
