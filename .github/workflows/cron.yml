# Set repository variable RECONCILE_SCHEDULER=vercel when handing scheduling to Vercel.
# Every 10 minutes: re-check unpaid orders with Razorpay, expire stale ones,
# and send owner alerts (spend, failures, OTP spikes). Free replacement for
# Vercel Cron. Needs repository secrets SITE_URL and CRON_SECRET.
name: reconcile
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || vars.RECONCILE_SCHEDULER != 'vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/reconcile
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL/CRON_SECRET not set"; exit 0; fi
          curl --fail-with-body -sS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reconcile"